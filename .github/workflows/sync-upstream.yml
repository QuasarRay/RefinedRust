name: Sync RefinedRust from GitLab

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: refinedrust-gitlab-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and publish exact upstream refs
        shell: bash
        run: |
          set -euo pipefail

          git remote add gitlab https://gitlab.mpi-sws.org/lgaeher/refinedrust-dev.git

          # Track all upstream branches and tags, including forced updates and deletions.
          git fetch --prune --prune-tags gitlab \
            '+refs/heads/*:refs/remotes/gitlab/*' \
            '+refs/tags/*:refs/tags/*'

          # Keep the GitHub default branch 'main' dedicated to CI configuration.
          # Branches under 'upstream/*' are byte-for-byte Git objects from GitLab.
          git push --force --prune origin \
            '+refs/remotes/gitlab/*:refs/heads/upstream/*'

          # Preserve original upstream tag names, including tag deletions.
          git push --force --prune origin \
            '+refs/tags/*:refs/tags/*'
